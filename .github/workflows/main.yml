name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build Gradle Project
        run: |
          # Tìm file build.gradle và chuyển vào thư mục đó
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found build.gradle at: $BUILD_FILE"
          cd "$PROJECT_DIR"
          
          # Chạy build
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simulacrum-Mod-JAR
          path: '**/build/libs/*.jar'
