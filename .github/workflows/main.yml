name: Build Trollmaster Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project Automatically
        run: |
          # Tìm xem file build.gradle nằm ở thư mục nào
          BUILD_PATH=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          if [ -z "$BUILD_PATH" ]; then
            echo "Lỗi: Không tìm thấy file build.gradle!"
            exit 1
          fi
          
          # Lấy tên thư mục chứa file và chuyển vào đó
          TARGET_DIR=$(dirname "$BUILD_PATH")
          echo "Đang build tại thư mục: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Cấp quyền thực thi và chạy build
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trollmaster-Mod-JAR
          path: '**/build/libs/*.jar'
