name: Build Trollmaster Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Project
        run: |
          # Tự động tìm vị trí chứa file build.gradle
          BUILD_FILE=$(find . -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Không tìm thấy file build.gradle!"
            exit 1
          fi
          
          # Chuyển vào đúng thư mục chứa project để build
          DIR=$(dirname "$BUILD_FILE")
          cd "$DIR"
          
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trollmaster-Mod-JAR
          path: '**/build/libs/*.jar'
