name: Build Trollmaster Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-detect and Build Trollmaster
        run: |
          # Quét toàn bộ repo để tìm vị trí chứa build.gradle
          BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Lỗi: Không tìm thấy file build.gradle nào trong toàn bộ repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Đã tìm thấy build.gradle tại thư mục: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Cấp quyền và ưu tiên chạy gradlew wrapper nếu có
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            echo "Đang build bằng wrapper ./gradlew..."
            ./gradlew build --no-daemon
          else
            echo "Không có gradlew, đang build bằng gradle hệ thống..."
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trollmaster-Mod-JAR
          path: '**/build/libs/*.jar'
