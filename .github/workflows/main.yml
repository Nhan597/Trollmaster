name: Build Minecraft Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Build Project
        run: |
          # Tìm thư mục chứa file build.gradle
          TARGET_DIR=$(dirname $(find . -name "build.gradle" -not -path "*/.*" | head -n 1))
          echo "Found build.gradle in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          # Cấp quyền và thực thi gradlew
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Build
          path: '**/build/libs/*.jar'
