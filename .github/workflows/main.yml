name: Build Trollmaster Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          # Kiểm tra xem build.gradle nằm ở đâu và chuyển vào đúng thư mục đó
          if [ -f "build.gradle" ]; then
            echo "Tìm thấy build.gradle ở thư mục gốc."
          else
            # Tìm thư mục con chứa build.gradle đầu tiên
            SUB_DIR=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1 | xargs dirname)
            if [ -n "$SUB_DIR" ]; then
              echo "Chuyển vào thư mục: $SUB_DIR"
              cd "$SUB_DIR"
            else
              echo "Không tìm thấy file build.gradle nào!"
              exit 1
            fi
          }

          # Cấp quyền thực thi cho gradlew nếu có và tiến hành build
          chmod +x gradlew || true
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build
          fi

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trollmaster-Mod-JAR
          path: '**/build/libs/*.jar'
